# orders-api pipeline.
#   Merge requests and main         unit-test-job
#   main, or RELEASE_TAG set        build_image-job
#   DEPLOY_ENV=staging              deploy-staging
#   DEPLOY_ENV=production with RELEASE_TAG, started by hand   deploy-production

variables:
  APP_NAME: "orders-api"
  REGISTRY: "registry.example.com"

  # Trigger inputs; callers override these
  DEPLOY_ENV: ""
  RELEASE_TAG: ""

default:
  image: node:22

stages:
  - test
  - build
  - deploy


unit-test-job:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - npm ci
    - npm test

build_image-job:
  stage: build
  image: docker:27
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $RELEASE_TAG != ""
  script:
    - docker build -t $REGISTRY/$APP_NAME:$CI_COMMIT_SHORT_SHA .
    - docker push $REGISTRY/$APP_NAME:$CI_COMMIT_SHORT_SHA
  artifacts:
    paths: [image-digest.txt]

deploy-staging:
  stage: deploy
  image: alpine:3.20
  needs: [build_image-job]
  rules:
    - if: $DEPLOY_ENV == "staging"
  before_script:
    - apk add --no-cache curl
  script:
    # The deploy hook only accepts form-encoded bodies, not JSON
    - curl -X POST https://deploy.example.com/hooks/staging -d "image=$REGISTRY/$APP_NAME:$CI_COMMIT_SHORT_SHA"

deploy-production:
  stage: deploy
  image: alpine:3.20
  needs: [build_image-job]
  rules:
    - if: $DEPLOY_ENV == "production" && $RELEASE_TAG != ""
  when: manual
  before_script:
    - apk add --no-cache curl
  script:
    - curl -X POST https://deploy.example.com/hooks/production -d "image=$REGISTRY/$APP_NAME:$CI_COMMIT_SHORT_SHA"
